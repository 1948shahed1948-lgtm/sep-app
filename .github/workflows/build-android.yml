name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            dl.google.com:443
            maven.google.com:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            services.gradle.org:443
            repo.maven.apache.org:443
            downloads.gradle.org:443

      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix package name and versionCode
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/applicationId ["'].*/applicationId \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/namespace ["'].*/namespace \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/versionCode [0-9]*/versionCode 9/" "$GRADLE"
            sed -i "s/versionName ["'].*/versionName \"1.0.8\"/" "$GRADLE"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"com.base6a664795ea19cd7af8bd2850.app\"/" "$MANIFEST"
          fi
          PKG_PATH=$(echo "com.base6a664795ea19cd7af8bd2850.app" | tr '.' '/')
          SRC_DIR="android/app/src/main/java"
          if [ -d "$SRC_DIR" ] && [ ! -d "$SRC_DIR/$PKG_PATH" ]; then
            mkdir -p "$SRC_DIR/$PKG_PATH"
            find "$SRC_DIR" -maxdepth 5 -name "*.java" -exec cp {} "$SRC_DIR/$PKG_PATH/" \;
            find "$SRC_DIR" -mindepth 1 -type d ! -path "$SRC_DIR/$PKG_PATH*" -empty -delete 2>/dev/null || true
          fi

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias quizgate \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass quizgate123 \
            -keypass quizgate123 \
            -dname "CN=QuizGate Plus, OU=Education, O=QuizGate, L=Riyadh, ST=Riyadh, C=SA"

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="quizgate123" \
            -Pandroid.injected.signing.key.alias="quizgate" \
            -Pandroid.injected.signing.key.password="quizgate123"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizgate-plus-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

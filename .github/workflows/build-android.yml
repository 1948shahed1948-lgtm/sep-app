name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f08459939c4209ba06daddb84f215b8ec5b4d929 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            dl.google.com:443
            maven.google.com:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            services.gradle.org:443
            repo.maven.apache.org:443
            downloads.gradle.org:443

      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@07d76e79d4b2c7f5da4f6f7b11ab7d9c3d8b0a91 # v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix package name and versionCode
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/applicationId [\"'].*/applicationId \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/namespace [\"'].*/namespace \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/versionCode [0-9]*/versionCode 8/" "$GRADLE"
            sed -i "s/versionName [\"'].*/versionName \"1.0.7\"/" "$GRADLE"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"com.base6a664795ea19cd7af8bd2850.app\"/" "$MANIFEST"
          fi
          PKG_PATH=$(echo "com.base6a664795ea19cd7af8bd2850.app" | tr '.' '/')
          SRC_DIR="android/app/src/main/java"
          if [ -d "$SRC_DIR" ] && [ ! -d "$SRC_DIR/$PKG_PATH" ]; then
            mkdir -p "$SRC_DIR/$PKG_PATH"
            find "$SRC_DIR" -maxdepth 5 -name "*.java" -exec cp {} "$SRC_DIR/$PKG_PATH/" \;
            find "$SRC_DIR" -mindepth 1 -type d ! -path "$SRC_DIR/$PKG_PATH*" -empty -delete 2>/dev/null || true
          fi

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias quizgate \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass quizgate123 \
            -keypass quizgate123 \
            -dname "CN=QuizGate Plus, OU=Education, O=QuizGate, L=Riyadh, ST=Riyadh, C=SA"

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="../release.keystore" \
            -Pandroid.injected.signing.store.password="quizgate123" \
            -Pandroid.injected.signing.key.alias="quizgate" \
            -Pandroid.injected.signing.key.password="quizgate123"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizgate-plus-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

# ─────────────────────────────────────────────────────────────────
# ⚠️ للنشر الرسمي على Google Play يلزم مفتاح توقيع ثابت:
# 1) keytool -genkeypair -v -keystore quizgate.keystore -alias quizgate \
#      -keyalg RSA -keysize 2048 -validity 10000
# 2) base64 quizgate.keystore > keystore.b64
# 3) أضف المحتوى كمستودع سري: ANDROID_KEYSTORE_BASE64

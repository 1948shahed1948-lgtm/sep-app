# ─────────────────────────────────────────────────────────────────────
#  بوابة الأسئلة بلس — بناء AAB آلياً في سحابة GitHub Actions
#  Package: com.base6a664795ea19cd7af8bd2850.app  |  Version: 1.0.7
# ─────────────────────────────────────────────────────────────────────
#  هذا الملف جاهز — انسخه يدوياً إلى:
#    .github/workflows/build-android.yml
#  ثم ارفع الكود إلى GitHub، وسيظهر في تبويب Actions.
# ─────────────────────────────────────────────────────────────────────
name: Build Android AAB

on:
  workflow_dispatch:  # تشغيل يدوي من GitHub
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) تحضير الكود
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      # 2) تثبيت الاعتماديات وبناء الويب
      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔨 Build web app (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      # 3) إعداد Capacitor + Android
      - name: 📲 Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔧 Fix package name and versionCode
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/applicationId [\"'].*/applicationId \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/namespace [\"'].*/namespace \"com.base6a664795ea19cd7af8bd2850.app\"/" "$GRADLE"
            sed -i "s/versionCode [0-9]*/versionCode 8/" "$GRADLE"
            sed -i "s/versionName [\"'].*/versionName \"1.0.7\"/" "$GRADLE"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"com.base6a664795ea19cd7af8bd2850.app\"/" "$MANIFEST"
          fi
          # إعادة ترتيب مجلد الجافا لمطابقة namespace
          PKG_PATH=$(echo "com.base6a664795ea19cd7af8bd2850.app" | tr '.' '/')
          SRC_DIR="android/app/src/main/java"
          if [ -d "$SRC_DIR" ] && [ ! -d "$SRC_DIR/$PKG_PATH" ]; then
            mkdir -p "$SRC_DIR/$PKG_PATH"
            find "$SRC_DIR" -maxdepth 5 -name "*.java" -exec cp {} "$SRC_DIR/$PKG_PATH/" \;
            find "$SRC_DIR" -mindepth 1 -type d ! -path "$SRC_DIR/$PKG_PATH*" -empty -delete 2>/dev/null || true
          fi
          echo "✅ Package name + versionCode 8 fixed"

      # 4) توليد مفتاح التوقيع
      - name: 🔑 Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias quizgate \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass quizgate123 \
            -keypass quizgate123 \
            -dname "CN=QuizGate Plus, OU=Education, O=QuizGate, L=Riyadh, ST=Riyadh, C=SA"

      # 5) بناء ملف AAB الموقّع
      - name: 🏗️ Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="../release.keystore" \
            -Pandroid.injected.signing.store.password="quizgate123" \
            -Pandroid.injected.signing.key.alias="quizgate" \
            -Pandroid.injected.signing.key.password="quizgate123"

      # 6) رفع الملف كـ Artifact
      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizgate-plus-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: ✅ Build complete
        run: |
          echo "🎉 ─────────────────────────────"
          echo "✅ AAB built successfully!"
          echo "📁 Download it from the workflow run artifacts"
          echo "📦 Package: com.base6a664795ea19cd7af8bd2850.app"
          echo "🏷️  Version: 1.0.0"
          echo "─────────────────────────────"

# ─────────────────────────────────────────────────────────────────
# ⚠️ للنشر الرسمي على Google Play يلزم مفتاح توقيع ثابت:
# 1) keytool -genkeypair -v -keystore quizgate.keystore -alias quizgate \
#      -keyalg RSA -keysize 2048 -validity 10000
# 2) base64 quizgate.keystore > keystore.b64
# 3) أضف المحتوى كمستودع سري: ANDROID_KEYSTORE_BASE64
# 4) استبدل خطوة "Generate release keystore" بـ:
#    - name: Decode keystore
#      run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
# ─────────────────────────────────────────────────────────────────
